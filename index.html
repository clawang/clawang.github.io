<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Link your external CSS stylesheet here -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="background"></div>
      <nav>
        <li>About</li>
        <li>Websites</li>
        <img src="./assets/logo.png" id="logo" alt="Claire Wang" />
        <li>Graphics</li>
        <li>Misc.</li>
      </nav>
      <div class="items-wrapper">
        <div class="item">
          <img
            src="./assets/louis-the-child-print-animation.gif"
            id="louis-the-child-gif"
          />
          <img
            src="./assets/louis-the-child.png"
            id="louis-the-child-pic"
            class="show"
          />
          <h3>Louis the Child - Black Marble</h3>
        </div>
        <div class="item">
          <img
            src="./assets/tierra-whack-animation.gif"
            id="tierra-whack-gif"
          />
          <img
            src="./assets/tierra-whack.png"
            class="show"
            id="tierra-whack-pic"
          />
          <h3>Tierra Whack - World Wide Whack</h3>
        </div>
        <div class="item">
          <img src="./assets/fred-again-animation.gif" id="fred-again-gif" />
          <img src="./assets/fred-again.png" class="show" id="fred-again-pic" />
          <h3>Fred Again Generator</h3>
        </div>
        <div class="item">
          <img src="./assets/pookiemon-animation.gif" id="pookiemon-gif" />
          <img src="./assets/pookiemon.png" class="show" id="pookiemon-pic" />
          <h3>Pookiemon</h3>
        </div>
      </div>
    </div>

    <!-- Link your external JavaScript file here -->
    <script src="script.js"></script>
  </body>
</html>
